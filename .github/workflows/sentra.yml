name: Sentra

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  sentra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for branch comparison

      - uses: ./.github/actions/sentra
        with:
          base_branch: ${{ github.base_ref || 'main' }}

